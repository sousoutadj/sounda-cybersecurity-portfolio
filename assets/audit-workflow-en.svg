<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Information Security Audit Approach</title>
  <desc id="desc">Six numbered stages from preparation to recommendations, displayed in two rows of three cards.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#13211d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="#eef3f1"/>
  <text x="72" y="95" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="800" fill="#1b2925">Information Security Audit Approach</text>
  <text x="72" y="143" font-family="Inter,Arial,sans-serif" font-size="22" fill="#61716b">From preparation to actionable recommendations</text>

  <g transform="translate(78 215)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">01</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Prepare</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Define the audit scope</text>
  </g>
  <g transform="translate(440 215)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">02</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Assess</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Questionnaire &amp; interviews</text>
  </g>
  <g transform="translate(802 215)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">03</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Collect</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Gather audit evidence</text>
  </g>
  <g transform="translate(78 445)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">04</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Score</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Weighting &amp; maturity</text>
  </g>
  <g transform="translate(440 445)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">05</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Analyze</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Identify security gaps</text>
  </g>
  <g transform="translate(802 445)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">06</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Recommend</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Propose an action plan</text>
  </g>
</svg>
