<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Démarche d’audit SSI</title>
  <desc id="desc">Six étapes numérotées de la préparation aux recommandations, présentées en deux rangées de trois cartes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#13211d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="#eef3f1"/>
  <text x="72" y="95" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="800" fill="#1b2925">Démarche d’audit SSI</text>
  <text x="72" y="143" font-family="Inter,Arial,sans-serif" font-size="22" fill="#61716b">De la préparation aux recommandations</text>

  <!-- row 1 -->
  <g transform="translate(78 215)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">01</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Préparer</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Définir le périmètre</text>
  </g>
  <g transform="translate(440 215)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">02</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Évaluer</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Questionnaire &amp; entretiens</text>
  </g>
  <g transform="translate(802 215)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">03</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Collecter</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Réunir les éléments de preuve</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(78 445)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">04</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Scorer</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Pondération &amp; maturité</text>
  </g>
  <g transform="translate(440 445)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">05</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Analyser</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Identifier les écarts</text>
  </g>
  <g transform="translate(802 445)" filter="url(#shadow)">
    <rect width="320" height="180" rx="24" fill="#ffffff" stroke="#ced9d4"/>
    <circle cx="48" cy="48" r="22" fill="#2f80ed"/><text x="48" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff">06</text>
    <text x="34" y="104" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#1b2925">Recommander</text>
    <text x="34" y="141" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64756e">Proposer un plan d’action</text>
  </g>
</svg>
