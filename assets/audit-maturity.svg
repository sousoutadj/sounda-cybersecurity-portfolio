<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Information Security Maturity Assessment</title>
  <desc id="desc">A stylized maturity scale from 0 to 100 percent with a target threshold at 70 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f2"/>
      <stop offset="1" stop-color="#e7ece8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26332e"/>
      <stop offset="0.7" stop-color="#4f6b5b"/>
      <stop offset="1" stop-color="#2878f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#14213d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" rx="48" fill="url(#bg)"/>
  <g opacity=".14" stroke="#2878f0" fill="none">
    <path d="M70 126H330M870 126h260M70 594h220M906 594h224"/>
    <circle cx="90" cy="126" r="8" fill="#2878f0"/><circle cx="1110" cy="126" r="8" fill="#2878f0"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="105" y="92" width="990" height="536" rx="34" fill="#fff"/>
  </g>
  <text x="160" y="166" font-family="Inter,Arial,sans-serif" font-size="28" fill="#4f6b5b" font-weight="700" letter-spacing="2">ISO/IEC 27002 • AUDIT &amp; GRC</text>
  <text x="160" y="218" font-family="Inter,Arial,sans-serif" font-size="44" fill="#1f2926" font-weight="800">Security Maturity Model</text>
  <text x="160" y="258" font-family="Inter,Arial,sans-serif" font-size="22" fill="#62676d">Weighted assessment • gap identification • corrective recommendations</text>
  <g transform="translate(160 326)">
    <rect x="0" y="0" width="880" height="34" rx="17" fill="#e8ece9"/>
    <rect x="0" y="0" width="616" height="34" rx="17" fill="url(#bar)"/>
    <line x1="616" y1="-30" x2="616" y2="84" stroke="#2878f0" stroke-width="4" stroke-dasharray="8 8"/>
    <rect x="555" y="-72" width="122" height="38" rx="19" fill="#2878f0"/>
    <text x="616" y="-46" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#fff" font-weight="700">70% TARGET</text>
    <g font-family="Inter,Arial,sans-serif" fill="#62676d" font-size="16" text-anchor="middle">
      <text x="0" y="72">0%</text><text x="176" y="72">20%</text><text x="352" y="72">40%</text><text x="528" y="72">60%</text><text x="704" y="72">80%</text><text x="880" y="72">100%</text>
    </g>
  </g>
  <g font-family="Inter,Arial,sans-serif" transform="translate(160 480)">
    <g fill="#26332e" font-size="18" font-weight="700">
      <text x="0" y="0">Security Policy</text><text x="300" y="0">Human Resources</text><text x="620" y="0">Access Control</text>
      <text x="0" y="50">Security Organization</text><text x="300" y="50">Physical Security</text><text x="620" y="50">Network Operations</text>
    </g>
    <circle cx="-22" cy="-6" r="7" fill="#4f6b5b"/><circle cx="278" cy="-6" r="7" fill="#4f6b5b"/><circle cx="598" cy="-6" r="7" fill="#4f6b5b"/>
    <circle cx="-22" cy="44" r="7" fill="#0cb3d9"/><circle cx="278" cy="44" r="7" fill="#0cb3d9"/><circle cx="598" cy="44" r="7" fill="#0cb3d9"/>
  </g>
</svg>
